<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Policy Summary</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Policy Summary</h1>
      <p class="subtitle">Member-friendly summary generated from policy JSON</p>
    </div>
    <div class="controls">
      <label>
        Policy
        <select id="policy-picker"></select>
      </label>
      <button id="toggle-json" type="button">Load your own JSON</button>
      <button id="print-btn" type="button">Print / PDF</button>
    </div>
  </header>

  <details id="json-panel" class="json-panel">
    <summary>Paste a policy JSON</summary>
    <textarea id="json-input" rows="10" placeholder='{"policy_number": "...", ...}'></textarea>
    <div class="json-actions">
      <button id="render-json" type="button">Render</button>
      <span id="json-error" class="json-error"></span>
    </div>
  </details>

  <main id="summary"></main>

  <footer class="footer">
    Generated by Policy Summary Generator — values are taken verbatim from the policy JSON.
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
